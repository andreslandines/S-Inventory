<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="S-Inventory: gestión de inventario">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="s_inventory">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>S-Inventory</title>
</head>
<body>
  <!-- Iniciar la aplicación Flutter -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Registrar el Service Worker de Firebase -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register(
            '/firebase-messaging-sw.js'
          );
          console.log('Service Worker de Firebase registrado');
        } catch (error) {
          console.error(
            'Error al registrar el Service Worker:',
            error
          );
        }
      });
    }
  </script>
</body>
</html>
